content:
  - name: linkedin_posts
    label: LinkedIn Posts
    type: file
    path: data/posts.json
    format: json
    list: true

    fields:
      - name: id
        type: uuid
        required: true
        hidden: true
        options:
          editable: false
          generate: false

      - name: title
        label: Post Title
        type: string
        description: Optional. Leave blank to display "LinkedIn Post".
        default: ""
        options:
          maxlength: 160

      - name: url
        label: LinkedIn Post URL
        type: string
        required: true
        description: Paste the complete HTTPS LinkedIn post URL.
        pattern:
          regex: '^https://(www\.)?linkedin\.com/.+$'
          message: Enter a valid HTTPS LinkedIn URL.

      - name: date
        label: Publishing Date
        type: date
        description: Optional publishing date.
        default: ""
        options:
          format: dd-MM-yyyy

      - name: description
        label: Description
        type: text
        description: Optional short description.
        default: ""
        options:
          maxlength: 500

      - name: category
        label: Category
        type: string
        description: Optional category, such as Business or Leadership.
        default: ""
        options:
          maxlength: 80

      - name: featured
        label: Featured Post
        type: boolean
        default: false

    operations:
      create: true
      delete: true

settings:
  hide: true
  commit:
    templates:
      create: "Add LinkedIn post"
      update: "Update LinkedIn posts"
      delete: "Delete LinkedIn post"